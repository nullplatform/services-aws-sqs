name: beta

# Publishes a beta image from a `beta/**` branch. To try a change as a published image before
# it reaches main, push it to a branch named beta/<anything>:
#
#   git push origin HEAD:beta/<name>
#
# publish-test-image-oci builds the image, pushes it to the service's `beta/` repository as
# test-beta-<name>-<short sha> and registers it as a nullplatform oci_image artifact, so the
# beta can be deployed to a test scope from the platform. Only pushes to beta/** branches can
# assume the beta role (its trust requires that branch prefix; a pull_request token carries no
# branch in its sub), and the role can only write under beta/*, so a beta can never overwrite a
# released image. Nothing deletes beta tags: they are ephemeral by convention, and the SHA in
# the tag keeps two branches from overwriting each other by accident.
on:
  push:
    branches:
      - 'beta/**'

# A newer push to the same branch supersedes the running build.
concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  beta:
    # The template repository never publishes.
    if: ${{ !github.event.repository.is_template }}
    uses: nullplatform/actions-nullplatform/.github/workflows/publish-test-image-oci.yml@v1
    with:
      image_name: beta/agent-plugins/services/my-service
    secrets:
      # One beta role for every repository; the organization variable overrides it if the role ever moves.
      aws_role_arn: ${{ secrets.AWS_BETA_ROLE_ARN }}
      artifact_np_api_key: ${{ secrets.ARTIFACT_NP_API_KEY }}
