name: auto-merge-release-pr

# Runs when the release workflow finishes and merges the release PR it left open,
# with the release App. on: workflow_run (not pull_request): PRs opened by
# github-actions[bot] have their pull_request runs held for manual approval since 2026-06.
on:
  workflow_run:
    workflows: ["release"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    uses: nullplatform/actions-nullplatform/.github/workflows/auto-merge-release.yml@v1
    secrets:
      app-id: ${{ secrets.APP_RELEASE_ID }}
      app-private-key: ${{ secrets.APP_RELEASE_PRIVATE_KEY }}
