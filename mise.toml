# ---------------------------------------------------------------------------
# Run this service locally as a package: `np package run` (or `mise run run`).
#
# This repo is a BASE package: bash scripts built FROM the worker-bridge image,
# with no package.json and no manifest. These two tasks are the whole contract
# with the CLI — `np package build --image` runs `build:image`, and
# `np package run` runs `run`. See "Run locally as a package" in the README.
# ---------------------------------------------------------------------------

[tasks."build:image"]
description = "Build the worker image (worker-bridge + this service baked in)"
run = "docker build -t my-service-worker:dev ."

# Runs the service the way production does: a controlplane-agent with the
# worker orchestrator (docker backend) that SPAWNS the worker container and
# talks to it over gRPC/mTLS. --network host so the agent can reach the worker
# it publishes on the host (Linux; on Docker Desktop enable host networking).
#
# `np package run` sets NP_PACKAGE_ENV_FLAGS (`-e A -e B …`, the names of the
# shell variables to forward, spliced UNQUOTED on purpose: validated identifiers
# only, docker reads each value from the environment) and NP_PACKAGE_ENV_JSON
# (the same variables as a JSON object). The flags put them in the AGENT
# container; the JSON goes into an NP_WORKER_RULES entry, which is how the agent
# hands env to the WORKER it spawns — the docker backend applies rule env, not
# NP_WORKER_ENV. Run without the CLI and both are empty, which is fine.
[tasks.run]
description = "Run locally: an agent (docker backend) that spawns this service's worker"
depends = ["build:image"]
run = """
set -eu
: "${NP_API_KEY:?set NP_API_KEY}"
slug="${NP_PACKAGE_SLUG:-my-service}"
env_json='{}'
[ -n "${NP_PACKAGE_ENV_JSON:-}" ] && env_json="$NP_PACKAGE_ENV_JSON"
worker_rules='[{"match":{"package":"'"$slug"'"},"env":'"$env_json"'}]'
docker rm -f np-my-service-agent >/dev/null 2>&1 || true
# A worker left by a previous run would be adopted as is, old image included.
stale=$(docker ps -aq --filter "name=np-worker-.*-${slug}-")
[ -n "$stale" ] && docker rm -f $stale >/dev/null 2>&1
# shellcheck disable=SC2086  # NP_PACKAGE_ENV_FLAGS must word-split into `-e NAME` pairs
docker run --rm --name np-my-service-agent --network host \
  -v /var/run/docker.sock:/var/run/docker.sock \
  ${NP_PACKAGE_ENV_FLAGS:-} \
  -e NP_API_KEY -e NP_LOG_LEVEL="${NP_LOG_LEVEL:-INFO}" \
  -e NP_WORKER_BACKEND=docker \
  -e NP_WORKER_IMAGE=my-service-worker:dev \
  -e NP_WORKER_RULES="$worker_rules" \
  "${NP_AGENT_IMAGE:-public.ecr.aws/nullplatform/controlplane-agent:latest}" \
  -runtime=host -tags=package:"$slug",local:"${NP_LOCAL_USER:-$USER}"
"""
